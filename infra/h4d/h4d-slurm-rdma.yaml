# Cluster Toolkit blueprint: H4D Slurm cluster with Cloud RDMA, sized for ISx64.
#
# Requires Cluster Toolkit v1.70.0 or later. Earlier versions have no H4D support and
# fail on the rdma network profile rather than on anything that names H4D.
#
#   ./gcluster create infra/h4d/h4d-slurm-rdma.yaml --vars project_id=PROJECT
#   ./gcluster deploy isx-h4d
#
# Scaling this is two numbers: node_count_dynamic_max here, and the -N/-n on srun.
# What does NOT scale by parameter:
#   * Cloud RDMA is single-zone. The cluster cannot span zones, so the ceiling is
#     whatever one zone holds.
#   * Compact placement policies have a maximum size. Past it you need several and
#     locality between them is not guaranteed, which is where the fabric is expected to
#     show an inflection.

blueprint_name: isx-h4d

vars:
  project_id: ## set on the command line
  deployment_name: isx-h4d
  region: us-central1
  # One zone, deliberately. Cloud RDMA does not cross zones.
  zone: us-central1-b

  # Phase 1 baseline. 16 nodes x 4 PEs = 64 PEs, enough to prove the fabric and the
  # port. Phase 2 raises this; see the note above about what else has to move.
  h4d_node_count: 16

  # h4d-highmem-192: 192 vCPU, 1488 GB. The highmem shape is the point. ISx64 holds
  # about 2.5x the key array resident, so memory per node sets how much of the target
  # a given node count can sort.
  h4d_machine_type: h4d-highmem-192-lssd

  # Cloud RDMA requires the HPC VM image. Rocky 8 build 20250917 or later ships the
  # iDPF/iRDMA driver and libfabric 2.2.0. The project must be allowed by
  # compute.trustedImageProjects; see 00_setup_project.sh.
  instance_image:
    project: cloud-hpc-image-public
    family: hpc-rocky-linux-8

deployment_groups:
- group: primary
  modules:

  # Management network: SSH, Slurm control traffic, NFS. gVNIC.
  - id: mgmt_net
    source: modules/network/vpc
    settings:
      subnetwork_name: isx-mgmt
      # Internal only. A 0.0.0.0/0 rule is rejected outright by some org policies and
      # the fabric has no need for one.
      firewall_rules:
      - name: isx-internal
        direction: INGRESS
        ranges: [10.0.0.0/8]
        allow:
        - protocol: tcp
        - protocol: udp
        - protocol: icmp
      - name: isx-iap-ssh
        direction: INGRESS
        ranges: [35.235.240.0/20]
        allow:
        - protocol: tcp
          ports: [22]

  # RDMA network. Built with the Falcon profile and attached as the single IRDMA vNIC.
  # H4D takes 2 to 10 vNICs total and exactly one of them may be IRDMA.
  - id: rdma_net
    source: modules/network/vpc
    settings:
      network_name: isx-rdma-net
      subnetwork_name: isx-rdma-sub
      network_profile: $(vars.zone)-vpc-falcon
      network_routing_mode: REGIONAL
      subnetwork_size: 16
      firewall_rules:
      - name: isx-rdma-internal
        direction: INGRESS
        ranges: [10.0.0.0/8]
        allow:
        - protocol: all

  # Shared home. SOS installs to /opt/isx on this so every node sees one build.
  - id: homefs
    source: modules/file-system/filestore
    use: [mgmt_net]
    settings:
      local_mount: /home
      size_gb: 2560
      filestore_tier: BASIC_SSD

  - id: h4d_nodeset
    source: community/modules/compute/schedmd-slurm-gcp-v6-nodeset
    use: [mgmt_net, rdma_net]
    settings:
      node_count_dynamic_max: $(vars.h4d_node_count)
      machine_type: $(vars.h4d_machine_type)
      instance_image: $(vars.instance_image)
      instance_image_custom: true
      # Locality is the whole point of an RDMA cluster. Without collocation the nodes
      # scatter across the zone and the all-to-all measures the wrong thing.
      enable_placement: true
      # On-demand, not Spot. A preempted node mid-sort destroys the run, and the study
      # asks for a configuration that "could realistically be used in production".
      enable_spot_vm: false
      bandwidth_tier: gvnic_enabled
      disk_type: hyperdisk-balanced
      disk_size_gb: 200

  - id: h4d_partition
    source: community/modules/compute/schedmd-slurm-gcp-v6-partition
    use: [h4d_nodeset]
    settings:
      partition_name: h4d
      is_default: true
      # Exclusive: one job owns a node. ISx64 runs several PEs per node itself, and a
      # co-tenant would perturb every timing the study reports.
      exclusive: true

  - id: login
    source: community/modules/scheduler/schedmd-slurm-gcp-v6-login
    use: [mgmt_net]
    settings:
      machine_type: n2-standard-8
      enable_login_public_ips: false

  - id: controller
    source: community/modules/scheduler/schedmd-slurm-gcp-v6-controller
    use: [mgmt_net, h4d_partition, homefs, login]
    settings:
      machine_type: n2-standard-16
      enable_controller_public_ips: false
      controller_startup_script: |
        #!/bin/bash
        # SOS and ISx64 are built once on a compute node and installed to shared
        # storage; see 02_build_sos.sh. Nothing to do here beyond directory setup.
        mkdir -p /opt/isx && chmod 1777 /opt/isx
